name: CI

on:
  push:
    branches: [feat/screenshot-first-mvp]
  pull_request:

jobs:
  workbench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
